name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build runtime ZIP
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix=dance-dance/ -o "dance-dance-${VERSION}.zip" HEAD

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" \
              "dance-dance-${VERSION}.zip#Dance-Dance (${VERSION} Runtime ZIP)" \
              "colouring-templates/dance-template.pdf#Printable Colouring Template (PDF)" \
              --clobber
          else
            gh release create "${VERSION}" \
              "dance-dance-${VERSION}.zip#Dance-Dance (${VERSION} Runtime ZIP)" \
              "colouring-templates/dance-template.pdf#Printable Colouring Template (PDF)" \
              --title "Dance-Dance ${VERSION}" \
              --generate-notes
          fi
